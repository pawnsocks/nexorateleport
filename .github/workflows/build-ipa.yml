              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(data))
              print(f"Updated {name}")

          # Keep the compile fixes that were proven by the successful 2.0 CI build.
          replacements = {
              "NexoraTeleport/Services/Engine.swift": [
                  (
                      "runtime.targetDates = Dictionary(uniqueKeysWithValues: keep)",
                      "runtime.targetDates = Dictionary(uniqueKeysWithValues: keep.map { ($0.key, $0.value) })",
                  ),
              ],
              "NexoraTeleport/Views/StatusView.swift": [
                  (
                      'LabeledContent("Speed", value: "\(location.speedKmh, specifier: "%.1f") km/h")',
                      'LabeledContent("Speed", value: "\(location.speedKmh.formatted(.number.precision(.fractionLength(1)))) km/h")',
                  ),
              ],
              "NexoraTeleport/Views/TodayView.swift": [
                  (
                      'metric("Speed", "\(route.targetSpeedKmh, specifier: "%.0f") km/h")',
                      'metric("Speed", "\(route.targetSpeedKmh.formatted(.number.precision(.fractionLength(0)))) km/h")',
                  ),
                  (
                      'metric("Speed", "\(location.speedKmh, specifier: "%.1f") km/h")',
                      'metric("Speed", "\(location.speedKmh.formatted(.number.precision(.fractionLength(1)))) km/h")',
                  ),
              ],
              "NexoraTeleport/Views/RoutePreviewView.swift": [
                  (
                      'LabeledContent("Distance", value: "\(route.distanceMeters / 1000, specifier: "%.1f") km")',
                      'LabeledContent("Distance", value: "\((route.distanceMeters / 1000).formatted(.number.precision(.fractionLength(1)))) km")',
                  ),
                  (
                      'LabeledContent("Speed", value: "\(route.targetSpeedKmh, specifier: "%.0f") km/h")',
                      'LabeledContent("Speed", value: "\(route.targetSpeedKmh.formatted(.number.precision(.fractionLength(0)))) km/h")',
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              path.write_text(text)

          # Make the app friendly to zsign/Xenora by making CFBundleExecutable explicit.
          info = Path("NexoraTeleport/Info.plist")
          text = info.read_text()
          if "<key>CFBundleExecutable</key>" not in text:
              needle = "<key>CFBundleDisplayName</key>\n\t<string>Nexora Teleport</string>"
              replacement = needle + "\n\t<key>CFBundleExecutable</key>\n\t<string>$(EXECUTABLE_NAME)</string>"
              if needle not in text:
                  raise SystemExit("Could not patch CFBundleExecutable")
              text = text.replace(needle, replacement)
          info.write_text(text)

          # Version 2.1.0 build 3.
          pbx = Path("NexoraTeleport.xcodeproj/project.pbxproj")
          text = pbx.read_text()
          text = text.replace("CURRENT_PROJECT_VERSION = 2;", "CURRENT_PROJECT_VERSION = 3;")
          text = text.replace("MARKETING_VERSION = 2.0.0;", "MARKETING_VERSION = 2.1.0;")
          pbx.write_text(text)
          PYFIX

      - name: Validate project metadata
        run: |
          plutil -lint NexoraTeleport/Info.plist
          plutil -lint NexoraTeleport/WidgetExtension/Info.plist
          xcodebuild -version
          xcodebuild -project NexoraTeleport.xcodeproj -list

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project NexoraTeleport.xcodeproj \
            -scheme NexoraTeleport \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find and verify built app
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build" -type d -name "NexoraTeleport.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: NexoraTeleport.app was not found."
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          echo "Executable: $EXEC"
          test -f "$APP_PATH/$EXEC"

      - name: Create unsigned IPA
        run: |
          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/NexoraTeleport.app"
          cd "$GITHUB_WORKSPACE/ipa"
          zip -r -9 "$GITHUB_WORKSPACE/NexoraTeleport-2.1-unsigned.ipa" Payload

      - name: Verify IPA
        run: |
          test -s "$GITHUB_WORKSPACE/NexoraTeleport-2.1-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/NexoraTeleport-2.1-unsigned.ipa"
          unzip -t "$GITHUB_WORKSPACE/NexoraTeleport-2.1-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexoraTeleport-2.1-unsigned-IPA
          path: NexoraTeleport-2.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
