name: Build Nexora Teleport IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Show project schemes
        run: |
          xcodebuild \
            -project NexoraTeleport.xcodeproj \
            -list

      - name: Patch known Xcode compile issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              "NexoraTeleport/Services/Engine.swift": [
                  (
                      r'''runtime.targetDates = Dictionary(uniqueKeysWithValues: keep)''',
                      r'''runtime.targetDates = Dictionary(uniqueKeysWithValues: keep.map { ($0.key, $0.value) })'''
                  ),
              ],
              "NexoraTeleport/Views/StatusView.swift": [
                  (
                      r'''LabeledContent("Speed", value: "\(location.speedKmh, specifier: "%.1f") km/h")''',
                      r'''LabeledContent("Speed", value: "\(location.speedKmh.formatted(.number.precision(.fractionLength(1)))) km/h")'''
                  ),
              ],
              "NexoraTeleport/Views/TodayView.swift": [
                  (
                      r'''metric("Speed", "\(route.targetSpeedKmh, specifier: "%.0f") km/h")''',
                      r'''metric("Speed", "\(route.targetSpeedKmh.formatted(.number.precision(.fractionLength(0)))) km/h")'''
                  ),
                  (
                      r'''metric("Speed", "\(location.speedKmh, specifier: "%.1f") km/h")''',
                      r'''metric("Speed", "\(location.speedKmh.formatted(.number.precision(.fractionLength(1)))) km/h")'''
                  ),
              ],
              "NexoraTeleport/Views/RoutePreviewView.swift": [
                  (
                      r'''LabeledContent("Distance", value: "\(route.distanceMeters / 1000, specifier: "%.1f") km")''',
                      r'''LabeledContent("Distance", value: "\((route.distanceMeters / 1000).formatted(.number.precision(.fractionLength(1)))) km")'''
                  ),
                  (
                      r'''LabeledContent("Speed", value: "\(route.targetSpeedKmh, specifier: "%.0f") km/h")''',
                      r'''LabeledContent("Speed", value: "\(route.targetSpeedKmh.formatted(.number.precision(.fractionLength(0)))) km/h")'''
                  ),
              ],
          }

          for filename, replacements in fixes.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected source line not found in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)
              print(f"Patched {filename}")
          PY

      - name: Build Nexora Teleport
        run: |
          set -o pipefail

          xcodebuild \
            -project NexoraTeleport.xcodeproj \
            -scheme NexoraTeleport \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find built app
        run: |
          echo "Searching for NexoraTeleport.app..."

          APP_PATH=$(find "$PWD/build" -type d -name "NexoraTeleport.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: NexoraTeleport.app was not found."
            find "$PWD/build" -maxdepth 6 -type d -name "*.app" -print || true
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        run: |
          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/NexoraTeleport.app"

          cd "$GITHUB_WORKSPACE/ipa"
          zip -r -9 "$GITHUB_WORKSPACE/NexoraTeleport-unsigned.ipa" Payload

      - name: Verify IPA
        run: |
          ls -lh "$GITHUB_WORKSPACE/NexoraTeleport-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/NexoraTeleport-unsigned.ipa" | head -n 50

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexoraTeleport-unsigned-IPA
          path: NexoraTeleport-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
